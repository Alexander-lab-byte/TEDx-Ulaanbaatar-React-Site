<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Social Media Sharing / Open Graph Tags -->
  <meta property="og:title" content="TEDxUlaanbaatar Empathy School Youth 2026">
  <meta property="og:description" content="14 voices. 100 seats. One day of live student ideas, teacher perspectives, and youth-led innovation in Ulaanbaatar. Apply now!">
  <meta property="og:image" content="https://YOUR_WEBSITE_URL.com/social-banner.jpg">
  <meta property="og:url" content="https://YOUR_WEBSITE_URL.com">
  <meta property="og:type" content="website">

  <!-- Twitter / X Card Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TEDxUlaanbaatar Empathy School Youth 2026">
  <meta name="twitter:description" content="Join us for a day of youth-led innovation and ideas worth spreading. Apply to speak or join the team today.">
  <meta name="twitter:image" content="https://YOUR_WEBSITE_URL.com/social-banner.jpg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Talks | TEDx Ulaanbaatar Empathy School Youth</title>

  <link rel="icon" type="image/png" href="logo-white.png">
  <link rel="apple-touch-icon" href="logo-white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>

  <style>
    /* Reset & Prevent Horizontal Scroll */
    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    /* Navigation Alignment Styles */
    header.nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(8, 8, 8, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      position: relative;
    }
    .brand-logo-container {
      display: flex;
      align-items: center;
      z-index: 1001;
      flex-shrink: 0 !important;
    }
    .brand-logo-img {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    nav.nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    nav.nav-links a {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted, #A1A1AA);
      transition: color 0.25s ease;
      text-decoration: none;
    }
    nav.nav-links a:hover, nav.nav-links a.active { 
      color: var(--text-white, #FFFFFF); 
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: 12px;
    }

    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
      color: var(--text-muted, #A1A1AA);
      padding: 6px 14px;
      border-radius: 100px;
      font-family: 'Space Grotesk', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .lang-toggle-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    /* Centered & Reinforced Mobile Menu Button */
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      z-index: 10001 !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      align-self: center;
      flex-shrink: 0 !important;
      gap: 5px;
    }
    .mobile-menu-btn span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: #FFFFFF;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .mobile-menu-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .mobile-menu-btn.active span:nth-child(2) {
      opacity: 0;
    }
    .mobile-menu-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile Responsive Breakpoints & Navigation Drawer */
    @media (max-width: 992px) {
      .mobile-menu-btn { 
        display: flex !important; 
        margin-left: auto;
      }

      nav.nav-links {
        display: flex !important;
        position: fixed !important;
        top: 0 !important; 
        right: -100% !important;
        width: 85vw !important;
        max-width: 320px !important;
        height: 100vh !important;
        height: 100dvh !important;
        background: #0c0c0c !important;
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 90px 24px 30px !important;
        gap: 16px !important;
        transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.9);
        z-index: 10000 !important;
        overflow-y: auto;
      }

      nav.nav-links.nav-active {
        right: 0 !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      nav.nav-links a {
        font-size: 16px !important;
        width: 100%;
        padding-bottom: 10px !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .nav-actions {
        margin-left: 0;
        margin-top: 12px;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        gap: 14px;
      }

      .btn-primary {
        width: 100%;
        padding: 12px 20px !important;
        font-size: 12px !important;
      }
    }

    /* Aesthetic Coming Soon Styles */
    .coming-soon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
    }
    .aesthetic-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 24px;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }
    @keyframes pulseGlow {
      0% { 
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.3);
        text-shadow: 0 0 10px rgba(235, 0, 40, 0); 
      }
      100% { 
        -webkit-text-stroke: 2px var(--ted-red);
        text-shadow: 0 0 40px rgba(235, 0, 40, 0.6); 
      }
    }
    .coming-soon-sub {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.6;
    }

    @media (max-width: 540px) {
      .coming-soon-sub {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand-logo-container" title="TEDx Ulaanbaatar Empathy School Youth">
      <img src="logo-white.png" alt="TEDx Logo" class="brand-logo-img">
    </a>

    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html#about" data-lang-en="About" data-lang-mn="Бидний тухай">About</a>
      <a href="index.html#seats" data-lang-en="Seats" data-lang-mn="Суудал">Seats</a>
      <a href="index.html#speakers" data-lang-en="Speakers" data-lang-mn="Илтгэгчид">Speakers</a>
      <a href="library.html" class="active" data-lang-en="Talks" data-lang-mn="Илтгэлүүд">Talks</a>
      <a href="team.html" data-lang-en="Team" data-lang-mn="Баг">Team</a>
      <a href="apply.html" data-lang-en="Apply" data-lang-mn="Бүртгүүлэх" style="color:var(--ted-red); font-weight:700;">Apply</a>
      <a href="index.html#contact" data-lang-en="Contact" data-lang-mn="Холбоо барих">Contact</a>
      
      <div class="nav-actions">
        <button class="lang-toggle-btn" onclick="toggleLanguage()">
          <span class="lang-en active" style="color:var(--ted-red);">EN</span> / <span class="lang-mn">MN</span>
        </button>
        <a href="index.html#seats" class="btn-primary" style="padding:8px 16px; font-size:11px;" data-lang-en="Reserve Seat" data-lang-mn="Суудал захиалах">Reserve Seat</a>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="coming-soon-wrapper reveal">
      <h1 class="aesthetic-text" data-lang-en="Coming Soon" data-lang-mn="Тун удахгүй">Coming Soon</h1>
      <p class="coming-soon-sub" data-lang-en="The full library of live ideas, student talks, and inspiration will be unlocked right here after the event concludes." data-lang-mn="Арга хэмжээ дууссаны дараа сурагчдын болон зочдын бүх илтгэлийн бичлэгүүд энд байрших болно.">
        The full library of live ideas, student talks, and inspiration will be unlocked right here after the event concludes.
      </p>
    </div>
  </div>
</main>

<footer style="margin-top: 0;">
  <div class="wrap">
    <div class="brand-logo" style="margin-bottom:16px;">
      <img src="logo-white.png" alt="TEDx Logo">
    </div>
    <div class="footer-legal">
      <div data-lang-en="This independent TEDx event is operated under license from TED." data-lang-mn="Энэхүү бие даасан TEDx арга хэмжээ нь TED-ийн тусгай зөвшөөрлийн дагуу зохион байгуулагдаж байна.">This independent TEDx event is operated under license from TED.</div>
      <div><strong>TEDxUlaanbaatar Empathy School Youth © 2026</strong></div>
    </div>
  </div>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const menuBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');

    if (menuBtn && navLinks) {
      menuBtn.onclick = function(e) {
        e.stopPropagation();
        navLinks.classList.toggle('nav-active');
        menuBtn.classList.toggle('active');
      };

      navLinks.querySelectorAll('a').forEach(link => {
        link.onclick = function() {
          navLinks.classList.remove('nav-active');
          menuBtn.classList.remove('active');
        };
      });
    }
  });
</script>
</body>
</html>
